            day_of_week: (Number) Day of week, 0 Sunday, 6 Saturday
            default_shares_expiration: (Number) Default expiration for newly created shares as number of days. Not set means no default expiration.
            denied_ip: (List of String) Connections from these IP/Mask are not allowed. Denied rules will be evaluated before allowed ones.
            denied_login_methods: '(List of String) Disabled login methods. Valid values: "publickey", "password", "password-over-SSH", "keyboard-interactive", "publickey+password", "publickey+keyboard-interactive", "password+publickey", "keyboard-interactive+publickey", "TLSCertificate", "TLSCertificate+password". The "password+publickey" and "keyboard-interactive+publickey" multi-step variants are available in the Enterprise edition only.'
            denied_patterns: (List of String) Files/directories with these, case insensitive, patterns are not allowed.
            denied_protocols: '(List of String) Disabled protocols. Valid values: SSH, FTP, DAV, HTTP'
            denied_share_paths: (List of String) Virtual paths that cannot be shared. If a path is denied, shares for that path and any sub-path are rejected. Available in the Enterprise edition.
            denied_share_scopes: '(List of String) Share scopes that users are not allowed to use. Valid values: read, write, read_write. If all scopes are denied, sharing is completely disabled. Available in the Enterprise edition.'
            deny_policy: (Number) Set to 1 to hide denied files/directories in directory listing.
            description: (String) Optional description.
            digits: (Number) Minimum number of digit characters required.
            disable_concurrent_reads: (Boolean) Concurrent reads are safe to use and disabling them will degrade performance so they are enabled by default. Some servers automatically delete files once they are downloaded. Using concurrent reads is problematic with such servers.
            disable_concurrent_writes: (Boolean) Send write requests to the remote server one at a time, disabling SFTP write pipelining. Enable it for servers that accept only one write request at a time; throughput is then bound by the network round-trip time. Available in the Enterprise edition.
            disable_fs_checks: (Boolean) Disable checks for existence and automatic creation of home directory and virtual folders after user login.
            download_bandwidth: (Number) Maximum download bandwidth as KB/s. This is the default if no per-source limit match.
            download_concurrency: '(Number) How many parts are downloaded in parallel. Default: 5.'
            download_data_transfer: (Number) Maximum data transfer allowed for downloads as MB
            download_part_max_time: (Number) The maximum time allowed, in seconds, to download a single chunk. Not set means no timeout. Ignored for partial downloads.
            download_part_size: (Number) The buffer size (in MB) to use for multipart downloads. If this value is not set, the default value (5MB) will be used.
            endpoint: (String) Optional endpoint. Default is "blob.core.windows.net". If you use the emulator the endpoint must include the protocol, for example "http://127.0.0.1:10000".
            enforce_secure_algorithms: (Boolean) If enabled, only secure algorithms are allowed. This setting is currently enforced for SSH/SFTP. Available in the Enterprise edition.
            equality_check_mode: (Number) Defines how to check if two configs point to the same server (enables renaming between matching configs). 0 = username and endpoint must match (default), 1 = only the endpoint must match.
            expires_in: (Number) Defines account expiration in number of days from creation. Not set means no expiration.
            exposed_subpaths: '(List of String) Exposes only the listed sub-paths of the folder: each entry is mounted as a virtual directory under the virtual path and serves the matching sub-path of the folder. Canonical POSIX paths with a leading slash, each exposing a distinct subtree. On group mappings the same placeholders as the subpath are supported. Mutually exclusive with subpath. Available in the Enterprise edition.'
            external_auth_cache_time: (Number) Defines the cache time, in seconds, for users authenticated using an external auth hook. Not set means no cache.
            external_auth_disabled: (Boolean) If set, external auth hook will not be executed.
            file_patterns: (Attributes List) (see below for nested schema)
