            private_key_wo: '(String, Sensitive, Write-only) Write-only variant of private_key. Write-only variant of the matching attribute: the value is read from the configuration only and is never persisted to the Terraform plan or state. Requires Terraform 1.11 or later. Mutually exclusive with the non write-only attribute. Use the companion _wo_version attribute to trigger an update.'
            private_key_wo_version: (String) Trigger attribute for private_key_wo. Trigger attribute for the matching write-only attribute. Because write-only values are not stored in state, Terraform cannot detect changes to them. Bump this value to force the provider to re-apply the write-only value on the next apply.
            provider: (Number) Provider. -1 = None (on users the filesystem comes from the primary group, on groups no filesystem override for the members; Available in the Enterprise edition), 0 = local filesystem, 1 = S3 Compatible, 2 = Google Cloud, 3 = Azure Blob, 4 = Local encrypted, 5 = SFTP, 6 = HTTP, 7 = FTP
            quota_files: (Number) Maximum number of files allowed
            quota_size: (Number) Maximum size allowed as bytes.
            read_buffer_size: (Number) Optional read buffer size, as MB, to use for downloads. Omit to disable buffering, that's fine in most use cases.
            region: (String) S3 region.
            remote_directory: '(String) Server-side path used as the starting directory for all operations. Not a security boundary: server-side symlinks may resolve outside it. Honored only while the ftp backend is enabled in the allow_remote_directory setting of the common configuration; it is still stored when the backend is disabled, but connections using it are rejected. Available in the Enterprise edition.'
            role: '(String) Role name. With resource isolation enabled on the role, the resource is visible to the admins carrying the same role and its storage is measured against the allowlist of the role. An admin carrying a role can use only its own role, which the server applies to the resources it creates: name it in the configuration. Reference the role by attribute, for example sftpgo_role.tenant.name, so that Terraform orders the operations: the server refuses to remove a role a group or a folder still names. Available in the Enterprise edition.'
            role_arn: (String) Optional IAM Role ARN to assume.
            s3config: (Attributes) S3 compatible object storage configuration details. (see below for nested schema)
            sas_url: (String, Sensitive, Deprecated) Plain text SAS URL. If you set a string in SFTPGo secret format, SFTPGo will keep the current secret on updates while the Terraform plan will save your value. Don't do this unless you are sure the values match (e.g because you imported an existing resource). Mutually exclusive with sas_url_wo.
            sas_url_wo: '(String, Sensitive, Write-only) Write-only variant of sas_url. Write-only variant of the matching attribute: the value is read from the configuration only and is never persisted to the Terraform plan or state. Requires Terraform 1.11 or later. Mutually exclusive with the non write-only attribute. Use the companion _wo_version attribute to trigger an update.'
            sas_url_wo_version: (String) Trigger attribute for sas_url_wo. Trigger attribute for the matching write-only attribute. Because write-only values are not stored in state, Terraform cannot detect changes to them. Bump this value to force the provider to re-apply the write-only value on the next apply.
            session_token: (String) Optional Session token that is a part of temporary security credentials provisioned by AWS STS.
            sftpconfig: (Attributes) Remote SFTP server configuration details. (see below for nested schema)
            share_policy: (Attributes) Share access rules. Available in the Enterprise edition (see below for nested schema)
            skip_tls_verify: (Boolean) If true, the TLS certificate of the FTP server is not verified.
            socks_password: (String, Sensitive, Deprecated) Plain text SOCKS password. If you set a string in SFTPGo secret format, SFTPGo will keep the current secret on updates while the Terraform plan will save your value. Don't do this unless you are sure the values match (e.g because you imported an existing resource). Mutually exclusive with socks_password_wo. Available in the Enterprise edition.
            socks_password_wo: '(String, Sensitive, Write-only) Write-only variant of socks_password. Write-only variant of the matching attribute: the value is read from the configuration only and is never persisted to the Terraform plan or state. Requires Terraform 1.11 or later. Mutually exclusive with the non write-only attribute. Use the companion _wo_version attribute to trigger an update.'
            socks_password_wo_version: (String) Trigger attribute for socks_password_wo. Trigger attribute for the matching write-only attribute. Because write-only values are not stored in state, Terraform cannot detect changes to them. Bump this value to force the provider to re-apply the write-only value on the next apply.
            socks_proxy: '(String) The address of the SOCKS proxy server, including schema, host, and port. Examples: socks5://127.0.0.1:1080, socks4://127.0.0.1:1080, socks4a://127.0.0.1:1080. Available in the Enterprise edition.'
            socks_username: (String) The optional SOCKS username. Available in the Enterprise edition.
            sources: (List of String) Source networks in CIDR notation as defined in RFC 4632 and RFC 4291 for example "192.0.2.0/24" or "2001:db8::/32". The limit applies if the defined networks contain the client IP.
            specials: (Number) Minimum number of special characters required.
            sse_customer_key: (String, Sensitive, Deprecated) Plain text Server-Side encryption key. If you set a string in SFTPGo secret format, SFTPGo will keep the current secret on updates while the Terraform plan will save your value. Don't do this unless you are sure the values match (e.g because you imported an existing resource). Mutually exclusive with sse_customer_key_wo.
            sse_customer_key_wo: '(String, Sensitive, Write-only) Write-only variant of sse_customer_key. Write-only variant of the matching attribute: the value is read from the configuration only and is never persisted to the Terraform plan or state. Requires Terraform 1.11 or later. Mutually exclusive with the non write-only attribute. Use the companion _wo_version attribute to trigger an update.'
            sse_customer_key_wo_version: (String) Trigger attribute for sse_customer_key_wo. Trigger attribute for the matching write-only attribute. Because write-only values are not stored in state, Terraform cannot detect changes to them. Bump this value to force the provider to re-apply the write-only value on the next apply.
            start_directory: (String) Alternate starting directory. If not set, the default is "/". This option is supported for SFTP/SCP, FTP and HTTP (WebClient/REST API) protocols. Relative paths will use this directory as base.
            storage_class: (String) The storage class to use when storing objects. Leave not set for default.
            subpath: '(String) Re-roots the mapping: the mount at the virtual path serves the folder starting from this sub-path, which stays invisible in the virtual tree. Canonical POSIX path with a leading slash (e.g. /tenant1). The same folder can be mapped multiple times with distinct subpaths; every mapping of the same folder must use the same quota limits. On group mappings the %username% and %role% placeholders are supported. Mutually exclusive with exposed_subpaths.'
            tls_mode: (Number) 0 disabled, 1 Explicit, 2 Implicit.
            tls_username: (String) TLS certificate attribute to use as username. For FTP clients it must match the name provided using the "USER" command. For WebDAV, if no username is provided, the CN will be used as username. For WebDAV clients it must match the implicit or provided username.
            to: (String) End time in HH:MM format
            total_data_transfer: (Number) Maximum total data transfer as MB. You can set a total data transfer instead of the individual values for uploads and downloads.
            two_factor_protocols: '(List of String) Defines protocols that require two factor authentication. Valid values: SSH, FTP, HTTP'
            universe_domain: (String) The universe domain to use for Google Cloud API requests. If omitted or empty, the default public domain (googleapis.com) is used. Set this value if you need to connect to a custom Google Cloud environment, such as Google Distributed Cloud or a Sovereign Cloud. Available in the Enterprise edition
            updated_at: (Number) Last update time as unix timestamp in milliseconds.
            upload_bandwidth: (Number) Maximum upload bandwidth as KB/s. This is the default if no per-source limit match.
            upload_concurrency: '(Number) How many parts are uploaded in parallel. Default: 5.'
            upload_data_transfer: (Number) Maximum data transfer allowed for uploads as MB.
            upload_part_max_time: (Number) The maximum time allowed, in seconds, to upload a single chunk. The default value is 32. Not set means use the default.
            upload_part_size: (Number) The buffer size (in MB) to use for multipart uploads. If this value is not set, the default value (5MB) will be used.
            uppers: (Number) Minimum number of uppercase characters required.
            use_emulator: (Boolean) If true, the Azure Storage Emulator (Azurite) is used instead of the cloud service.
            used_quota_files: (Number) Used quota as number of files.
            used_quota_size: (Number) Used quota as bytes.
            user_settings: (Attributes) Settings to apply to users. Omit this block entirely to create a group with no default settings. When present, the nested filesystem block must be set explicitly (e.g. filesystem = { provider = 0 } for local). Defaults are no longer auto-populated from the server because this block contains write-only attributes. (see below for nested schema)
            user_type: '(String) Hint for authentication plugins. Valid values: LDAPUser, OSUser'
            username: (String) Username for FTP authentication.
            virtual_folders: (Attributes List) (see below for nested schema)
            virtual_path: (String) The folder will be available on this path.
            web_client: '(List of String) Web Client/user REST API restrictions. Valid values: write-disabled, password-change-disabled, password-reset-disabled, publickey-change-disabled, tls-cert-change-disabled, mfa-disabled, api-key-auth-change-disabled, info-change-disabled, shares-disabled, shares-without-password-disabled, shares-require-email-auth, shares-policy-change-disabled, wopi-disabled, rest-api-disabled. Only available in the Enterprise version: shares-require-email-auth, shares-policy-change-disabled, wopi-disabled, rest-api-disabled'
            write_buffer_size: (Number) Optional write buffer size, as MB, to use for uploads. Omit to disable buffering, that's fine in most use cases.
        importStatements:
            - |-
              # A group can be imported by name
              terraform import sftpgo_group.example "group name"
    sftpgo_license Resource - sftpgo:
        subCategory: ""
        description: 'License Note: This resource cannot be deleted. Running terraform destroy will remove it from Terraform state only, but not from the underlying system. Available in the Enterprise edition.'
        name: sftpgo_license Resource - sftpgo
        title: sftpgo_license Resource - sftpgo
        argumentDocs:
            event_actions: (List of Number) The event action types the license grants, with the values the type attribute of an event action uses.
            features: (Attributes) The features the license grants. (see below for nested schema)
            fips: (Number) 1 grants the FIPS mode.
            fs_actions: (List of Number) The filesystem action types the license grants, with the values the type attribute of a filesystem action uses.
            fs_providers: (List of Number) The storage backends the license grants, with the values the provider attribute of a filesystem configuration uses.
            ha: (List of Number) High availability is granted when the list contains 1.
            id: '(String) Identifier of the resource, a fixed placeholder: a single license is stored. terraform import takes the license key.'
            isolated_roles: (Number) -1 unlimited, 0 disabled, > 0 number of roles that can enable resource isolation.
            key: (String) License key. Required to add or update a license key.
            max_concurrent_transfers: (Number) Maximum concurrent transfers. 0 means the configured limit applies.
            metering: (Number) 1 disables metering.
            plugins: (Number) -1 unlimited, 0 disabled, > 0 number of allowed plugins.
            type: '(Number) License type: 0 = Disabled, 1 = Subscription, 2 = Lifetime'
            valid_from: (Number) Validity start time in Unix timestamp (milliseconds).
            valid_to: (Number) Validity end time in Unix timestamp (milliseconds).
            wopi_users: (Number) -1 unlimited, 0 disabled, > 0 number of allowed users.
        importStatements:
            - |-
              # The license can be imported by key
              terraform import sftpgo_license.example "license key"
    sftpgo_rlsafelist_entry Resource - sftpgo:
        subCategory: ""
        description: Rate limiters safe list entry
        name: sftpgo_rlsafelist_entry Resource - sftpgo
        title: sftpgo_rlsafelist_entry Resource - sftpgo
        argumentDocs:
            created_at: (Number) Creation time as unix timestamp in milliseconds.
            description: (String) Optional description.
            id: (String) Identifier of the resource, it matches the ipornet attribute. terraform import takes the same value.
            ipornet: (String) IP address or network in CIDR format, for example "192.168.1.2/32", "192.168.0.0/24", "2001:db8::/32". Changing this value after creation forces replacement because the SFTPGo API does not support renaming.
            protocols: (Number) Defines the protocol the entry applies to. 0 means all the supported protocols, 1 SSH, 2 FTP, 4 WebDAV, 8 HTTP. Protocols can be combined, for example 3 means SSH and FTP.
            updated_at: (Number) Last update time as unix timestamp in milliseconds.
        importStatements:
            - |-
              # A rate limiter safe list entry can be imported by IP or network
              terraform import sftpgo_rlsafelist_entry.example 192.168.1.0/24
    sftpgo_role Resource - sftpgo:
        subCategory: ""
        description: Role
        name: sftpgo_role Resource - sftpgo
        title: sftpgo_role Resource - sftpgo
        argumentDocs:
            account: (String) Storage account name.
            allowed_buckets: (Attributes List) Buckets granted to the role. (see below for nested schema)
            allowed_containers: (Attributes List) Containers granted to the role. (see below for nested schema)
            allowed_endpoints: (List of String) Endpoints granted to the role.
            allowed_paths: '(List of String) Absolute paths. A named path is accepted when it sits under one of them, matching on path separators. Write them in canonical form: the server stores the cleaned path, so /tmp/a/../b comes back as /tmp/b.'
            allowed_providers: '(List of Number) Storage backends the resources carrying the role may name: 0 = local filesystem, 1 = S3 Compatible, 2 = Google Cloud, 3 = Azure Blob, 4 = Local encrypted, 5 = SFTP, 6 = HTTP, 7 = FTP. A user or group whose filesystem.provider is -1 takes its storage from the primary group and needs no entry here.'
            allowed_proxies: (List of String) The SOCKS proxies an SFTP configuration may name, as SOCKS URLs such as socks5://host:port, compared as written. A listed proxy is required as soon as either SFTP list carries an entry, since the proxy resolves the endpoint in its own network.
            azure: (Attributes) The Azure Blob resources the resources carrying the role may name. An entry matches a configuration carrying the account and the container in its SAS URL as well. With no entries the granted backend admits every resource its credentials reach, and a configuration with no credentials of its own on the default host of its cloud. (see below for nested schema)
            bucket: (String) Bucket name.
            container: (String) Container name.
            created_at: (Number) Creation time as unix timestamp in milliseconds.
            description: (String) Optional description.
            endpoint: (String) Matched as the account host the backend derives, so the letter case, the scheme and a trailing slash name one service. An empty endpoint means blob.core.windows.net.
            ftp: '(Attributes) The FTP endpoints the resources carrying the role may name. The entries bound the host the server connects to: with none the granted backend connects to every host a configuration names. Entries are host:port; an entry with no port takes the default port of the backend, 22 for SFTP and 21 for FTP. (see below for nested schema)'
            gcs: (Attributes) The Google Cloud Storage resources the resources carrying the role may name. With no entries the granted backend admits every resource its credentials reach, and a configuration with no credentials of its own on the default host of its cloud. (see below for nested schema)
            http: '(Attributes) The HTTP endpoints the resources carrying the role may name. The entries bound the host the server connects to: with none the granted backend connects to every host a configuration names. Entries are base URLs with a scheme and a host; the path of an entry matches the endpoints under it, so an entry with no path matches every path on that host, while the scheme, the authority and the query are compared as written. (see below for nested schema)'
            id: (String) Identifier of the resource, it matches the name attribute. terraform import takes the same value.
            key_prefix: (String) An empty key prefix grants the whole container. The key prefix of a configuration is accepted when it sits under the one of the entry, on a / boundary.
            local: '(Attributes) The local paths the resources carrying the role may name. It applies to every provider: the home directory of an account is a local path whatever its storage backend. An empty list admits no named path; the accounts saved without a home directory get one generated from users_base_dir. (see below for nested schema)'
            name: (String) Unique name. Changing the name after creation forces replacement because the SFTPGo API does not support renaming.
            resource_isolation: '(Number) Resource isolation level: 0 disabled, 1 enabled. With isolation enabled the groups and folders carrying the role are visible to the admins carrying the same role, an account reaches the groups and folders of its own role, and the storage allowlist is enforced on every save. Supported data providers: MySQL, MariaDB, PostgreSQL, CockroachDB, SQLite. The number of roles that can enable it is licensed. A role that isolates its resources requires settings.storage_allowlist.local.users_base_dir and grants the backends listed in settings.storage_allowlist.allowed_providers. Available in the Enterprise edition.'
            s3: (Attributes) The S3 resources the resources carrying the role may name. With no entries the granted backend admits every resource its credentials reach, and a configuration with no credentials of its own on the default host of its cloud. (see below for nested schema)
            settings: (Attributes) Settings of the role. It carries the storage allowlist. Omit the block when the role carries no settings. Available in the Enterprise edition. (see below for nested schema)
            sftp: '(Attributes) The SFTP endpoints the resources carrying the role may name. The entries bound the host the server connects to: with none the granted backend connects to every host a configuration names. Entries are host:port; an entry with no port takes the default port of the backend, 22 for SFTP and 21 for FTP. (see below for nested schema)'
            storage_allowlist: '(Attributes) The storage the resources carrying the role may name. It is enforced when a user, a group or a folder carrying the role is saved, and only while resource_isolation is enabled. Omit the block to grant no backend: an allowlist starts from an explicit grant of the backends in allowed_providers. A granted backend with no entries admits every resource its credentials reach, and a cloud configuration with no credentials of its own on the default host of its cloud; with entries, a configuration is admitted when it matches one of them, the key prefix, the local paths and the HTTP path matching as prefixes on a segment boundary. Write the entries the way the resources of the role are configured: an entry is literal text and carries no placeholder. (see below for nested schema)'
            universe_domain: (String) Matched with the default filled in, so an empty value and googleapis.com are one service.
            updated_at: (Number) Last update time as unix timestamp in milliseconds.
            users_base_dir: '(String) Where the server generates the home directories it is not given a name for, for the accounts carrying the role: it replaces the global users_base_dir for them and is a grant of its own, not measured against allowed_paths; a home_dir written as <users_base_dir>/<username> is granted as well. Required while resource_isolation is enabled. Absolute path in canonical form.'
        importStatements:
            - |-
              # A role can be imported by name
              terraform import sftpgo_role.example "role name"
    sftpgo_rule Resource - sftpgo:
        subCategory: ""
        description: Event rule
        name: sftpgo_rule Resource - sftpgo
        title: sftpgo_rule Resource - sftpgo
        argumentDocs:
            actions: (Attributes List) List of actions to execute. (see below for nested schema)
            concurrent_execution: (Boolean) If enabled, allow to execute scheduled tasks concurrently from multiple SFTPGo instances.
            conditions: (Attributes) Defines the conditions that trigger the rule. (see below for nested schema)
            created_at: (Number) Creation time as unix timestamp in milliseconds.
            day_of_month: (String) Day of month in cron format, 1-31. Use * to match every day.
            day_of_week: (String) Day of week in cron format, 0-6 (Sunday-Saturday). Use * to match every day.
            description: (String) Optional description.
            event_statuses: '(List of Number) The filesystem event rules will be triggered only for actions with the specified status. Empty means any status. Suported values: 1 (OK), 2 (Failed), 3 (Failed for a quota exceeded error).'
            execute_sync: (Boolean) Supported for upload events and required for pre-* events and Identity provider login events if the action checks the account.
            fs_events: '(List of String) Filesystem events that trigger the rule. Supported values: "upload", "pre-upload", "first-upload", "download", "pre-download", "first-download", "delete", "pre-delete", "rename", "mkdir", "rmdir", "copy", "ssh_cmd"'
            fs_paths: (Attributes List) Shell-like pattern filters for filesystem events. For example "/adir/.txt"" will match paths in the "/adir" directory ending with ".txt". Double asterisk is supported, for example "/**/.txt" will match any file ending with ".txt". "/mydir/**" will match any entry in "/mydir". (see below for nested schema)
            group_names: (Attributes List) Shell-like pattern filters for group names. For example "group*"" will match group names starting with "group". (see below for nested schema)
            hour: (String) Hour in cron format, 0-23. Use * to match every hour.
            id: (String) Identifier of the resource, it matches the name attribute. terraform import takes the same value.
            idp_login_event: (Number) Identity Provider login event that trigger the rule. 0 any, 1 user, 2 admin.
            inverse_match: (Boolean) If true, the condition matches when the pattern does NOT match.
            is_failure_action: (Boolean) If true, this action executes only when a previous action in the rule has failed.
            match_fs_path: (Boolean) If enabled, the pattern is matched against the filesystem path instead of the virtual path. Filesystem paths are backend-dependent (local paths use the OS format; cloud storage paths have no leading slash). Available in the Enterprise edition.
            max_size: (Number) Maximum file size as bytes.
            min_size: (Number) Minimum file size as bytes.
            minute: (String) Available in the Enterprise edition
            month: (String) Month in cron format, 1-12. Use * to match every month.
            name: (String) Unique name. Changing the name after creation forces replacement because the SFTPGo API does not support renaming.
            names: (Attributes List) Shell-like pattern filters for usernames, folder names. For example "user*"" will match names starting with "user". For provider events, this filter is applied to the username of the admin executing the event. (see below for nested schema)
            options: (Attributes) Options for event conditions. (see below for nested schema)
            pattern: (String) Shell-like glob pattern to match against (e.g. ".txt", "user_", "/uploads/**").
            protocols: '(List of String) The filesystem event rule will be triggered only for the specified protocols. Empty means any protocol. Supported values: "SFTP", "SCP", "SSH", "FTP", "DAV", "HTTP", "HTTPShare","OIDC"'
            provider_events: '(List of String) Provider events that trigger the rule. Supported values: "add", "update", "delete".'
            provider_objects: '(List of String) The provider event rule will be triggered only for the specified provider objects. Empty means any provider object. Supported values: "user", "folder", "group", "admin", "api_key", "share", "event_rule", "event_action".'
            role_names: (Attributes List) Shell-like pattern filters for role names. For example "role*"" will match role names starting with "role". (see below for nested schema)
            schedules: '(Attributes List) List of schedules that trigger the rule. Hours: 0-23. Day of week: 0-6 (Sun-Sat). Day of month: 1-31. Month: 1-12. Asterisk (*) indicates a match for all the values of the field. e.g. every day of week, every day of month and so on. (see below for nested schema)'
            status: (Number) 1 enabled, 0 disabled.
            stop_on_failure: (Boolean) If true, no further actions in the rule will execute if this action fails.
            trigger: (Number) Event trigger. 1 = Filesystem event, 2 = Provider event, 3 = Schedule, 4 = IP Blocked, 5 = Certificate renewal, 6 = On demand, 7 = Identity Provider login.
            updated_at: (Number) Last update time as unix timestamp in milliseconds.
        importStatements:
            - |-
              # An event rule can be imported by name
              terraform import sftpgo_rule.example "rule name"
    sftpgo_trustedlist_entry Resource - sftpgo:
        subCategory: ""
        description: Trusted list entry. Available in the Enterprise edition.
        name: sftpgo_trustedlist_entry Resource - sftpgo
        title: sftpgo_trustedlist_entry Resource - sftpgo
        argumentDocs:
            created_at: (Number) Creation time as unix timestamp in milliseconds.
            description: (String) Optional description.
            id: (String) Identifier of the resource, it matches the ipornet attribute. terraform import takes the same value.
            ipornet: (String) IP address or network in CIDR format, for example "192.168.1.2/32", "192.168.0.0/24", "2001:db8::/32". Changing this value after creation forces replacement because the SFTPGo API does not support renaming.
            protocols: (Number) Defines the protocol the entry applies to. 0 means all the supported protocols, 1 SSH, 2 FTP, 4 WebDAV, 8 HTTP. Protocols can be combined, for example 3 means SSH and FTP.
            updated_at: (Number) Last update time as unix timestamp in milliseconds.
        importStatements:
            - |-
              # A trusted list entry can be imported by IP or network
              terraform import sftpgo_trustedlist_entry.example 192.168.1.0/24
    sftpgo_user Resource - sftpgo:
        subCategory: ""
        description: User
        name: sftpgo_user Resource - sftpgo
        title: sftpgo_user Resource - sftpgo
        argumentDocs:
            access_key: (String) AWS Access Key ID for authentication. Leave blank when using IAM roles or instance profiles.
            access_secret: (String, Sensitive, Deprecated) Plain text access secret. If you set a string in SFTPGo secret format, SFTPGo will keep the current secret on updates while the Terraform plan will save your value. Don't do this unless you are sure the values match (e.g because you imported an existing resource). Mutually exclusive with access_secret_wo.
            access_secret_wo: '(String, Sensitive, Write-only) Write-only variant of access_secret. Write-only variant of the matching attribute: the value is read from the configuration only and is never persisted to the Terraform plan or state. Requires Terraform 1.11 or later. Mutually exclusive with the non write-only attribute. Use the companion _wo_version attribute to trigger an update.'
            access_secret_wo_version: (String) Trigger attribute for access_secret_wo. Trigger attribute for the matching write-only attribute. Because write-only values are not stored in state, Terraform cannot detect changes to them. Bump this value to force the provider to re-apply the write-only value on the next apply.
            access_tier: (String) Blob Access Tier. Not set means the container default.
            access_time: (Attributes List) Time periods in which access is allowed (see below for nested schema)
            account_key: (String, Sensitive, Deprecated) Plain text account key. If you set a string in SFTPGo secret format, SFTPGo will keep the current secret on updates while the Terraform plan will save your value. Don't do this unless you are sure the values match (e.g because you imported an existing resource). Mutually exclusive with account_key_wo.
            account_key_wo: '(String, Sensitive, Write-only) Write-only variant of account_key. Write-only variant of the matching attribute: the value is read from the configuration only and is never persisted to the Terraform plan or state. Requires Terraform 1.11 or later. Mutually exclusive with the non write-only attribute. Use the companion _wo_version attribute to trigger an update.'
            account_key_wo_version: (String) Trigger attribute for account_key_wo. Trigger attribute for the matching write-only attribute. Because write-only values are not stored in state, Terraform cannot detect changes to them. Bump this value to force the provider to re-apply the write-only value on the next apply.
            account_name: (String) Storage account name. Leave blank to use SAS URL.
            acl: (String) The ACL to apply to uploaded objects. Not set means the bucket default.
            additional_emails: (List of String) Additional email addresses.
            additional_info: (String) Free form text field.
            allow_api_key_auth: (Boolean) If set, API Key authentication is allowed.
            allowed_ip: (List of String) Only connections from these IP/Mask are allowed. IP/Mask must be in CIDR notation as defined in RFC 4632 and RFC 4291 for example "192.0.2.0/24" or "2001:db8::/32"
            allowed_patterns: (List of String) Files/directories with these, case insensitive, patterns are allowed. Allowed file patterns are evaluated before the denied ones.
            allowed_share_paths: '(List of String) Virtual paths within which shares are allowed. If non-empty, share paths must be at or below one of these entries. Combined with denied_share_paths via longest-prefix match: the more specific entry wins, and if the same path appears in both lists the denied entry takes precedence. The string "/" acts as a wildcard. Available in the Enterprise edition.'
            api_key: (String, Sensitive, Deprecated) Plain text API key. If you set a string in SFTPGo secret format, SFTPGo will keep the current secret on updates while the Terraform plan will save your value. Don't do this unless you are sure the values match (e.g because you imported an existing resource). Mutually exclusive with api_key_wo.
            api_key_wo: '(String, Sensitive, Write-only) Write-only variant of api_key. Write-only variant of the matching attribute: the value is read from the configuration only and is never persisted to the Terraform plan or state. Requires Terraform 1.11 or later. Mutually exclusive with the non write-only attribute. Use the companion _wo_version attribute to trigger an update.'
            api_key_wo_version: (String) Trigger attribute for api_key_wo. Trigger attribute for the matching write-only attribute. Because write-only values are not stored in state, Terraform cannot detect changes to them. Bump this value to force the provider to re-apply the write-only value on the next apply.
            automatic_credentials: (Number) 0 = disabled, explicit JSON credentials must be provided (default); 1 = enabled, use Application Default Credentials (ADC) to find credentials.
            azblobconfig: (Attributes) Azure Blob Storage configuration details. (see below for nested schema)
            bandwidth_limits: (Attributes List) (see below for nested schema)
            bucket: (String) GCS bucket name.
            buffer_size: (Number) The buffer size (in MB) to use for uploads/downloads. Buffering could improve performance for high latency networks. With buffering enabled upload resume is not supported and a file cannot be opened for both reading and writing at the same time. Not set means disabled.
            check_password_disabled: (Boolean) If set, check password hook will not be executed.
            checksum_algorithm: '(String) Checksum algorithm to compute and send with uploads (PutObject, multipart upload, CopyObject) for end-to-end integrity verification. Leave empty (default) for maximum compatibility with S3-compatible services. Supported values: "crc32", "crc32c", "crc64nvme", "sha1", "sha256". Available in the Enterprise edition.'
            container: (String) Azure Blob Storage container name.
            created_at: (Number) Creation time as unix timestamp in milliseconds.
            credentials: (String, Sensitive, Deprecated) Plain text credentials. If you set a string in SFTPGo secret format, SFTPGo will keep the current secret on updates while the Terraform plan will save your value. Don't do this unless you are sure the values match (e.g because you imported an existing resource). Mutually exclusive with credentials_wo.
            credentials_wo: '(String, Sensitive, Write-only) Write-only variant of credentials. Write-only variant of the matching attribute: the value is read from the configuration only and is never persisted to the Terraform plan or state. Requires Terraform 1.11 or later. Mutually exclusive with the non write-only attribute. Use the companion _wo_version attribute to trigger an update.'
            credentials_wo_version: (String) Trigger attribute for credentials_wo. Trigger attribute for the matching write-only attribute. Because write-only values are not stored in state, Terraform cannot detect changes to them. Bump this value to force the provider to re-apply the write-only value on the next apply.
            cryptconfig: (Attributes) (see below for nested schema)
            custom_placeholders: (List of String) List of extra placeholders available for use in group configurations. Each placeholder can be referenced as %custom1%, %custom2%, and so on. Available in the Enterprise edition.
            custom1: (String) An extra placeholder value available for use in group configurations. It can be referenced as %custom1%. Available in the Enterprise edition.
            day_of_week: (Number) Day of week, 0 Sunday, 6 Saturday
            default_shares_expiration: (Number) Default expiration for newly created shares as number of days. Not set means no default expiration.
            denied_ip: (List of String) Connections from these IP/Mask are not allowed. Denied rules will be evaluated before allowed ones.
            denied_login_methods: '(List of String) Disabled login methods. Valid values: "publickey", "password", "password-over-SSH", "keyboard-interactive", "publickey+password", "publickey+keyboard-interactive", "password+publickey", "keyboard-interactive+publickey", "TLSCertificate", "TLSCertificate+password". The "password+publickey" and "keyboard-interactive+publickey" multi-step variants are available in the Enterprise edition only.'
            denied_patterns: (List of String) Files/directories with these, case insensitive, patterns are not allowed.
            denied_protocols: '(List of String) Disabled protocols. Valid values: SSH, FTP, DAV, HTTP'
            denied_share_paths: (List of String) Virtual paths that cannot be shared. If a path is denied, shares for that path and any sub-path are rejected. Available in the Enterprise edition.
            denied_share_scopes: '(List of String) Share scopes that users are not allowed to use. Valid values: read, write, read_write. If all scopes are denied, sharing is completely disabled. Available in the Enterprise edition.'
            deny_policy: (Number) Set to 1 to hide denied files/directories in directory listing.
            description: (String) Optional description.
            digits: (Number) Minimum number of digit characters required.
            disable_concurrent_reads: (Boolean) Concurrent reads are safe to use and disabling them will degrade performance so they are enabled by default. Some servers automatically delete files once they are downloaded. Using concurrent reads is problematic with such servers.
            disable_concurrent_writes: (Boolean) Send write requests to the remote server one at a time, disabling SFTP write pipelining. Enable it for servers that accept only one write request at a time; throughput is then bound by the network round-trip time. Available in the Enterprise edition.
            disable_fs_checks: (Boolean) Disable checks for existence and automatic creation of home directory and virtual folders after user login.
            download_bandwidth: (Number) Maximum download bandwidth as KB/s. Not set means unlimited. This is the default if no per-source limit match.
            download_concurrency: '(Number) How many parts are downloaded in parallel. Default: 5.'
            download_data_transfer: (Number) Maximum data transfer allowed for downloads as MB. Not set means no limit.
            download_part_max_time: (Number) The maximum time allowed, in seconds, to download a single chunk. Not set means no timeout. Ignored for partial downloads.
            download_part_size: (Number) The buffer size (in MB) to use for multipart downloads. If this value is not set, the default value (5MB) will be used.
            email: (String) User email address.
            endpoint: (String) Optional endpoint. Default is "blob.core.windows.net". If you use the emulator the endpoint must include the protocol, for example "http://127.0.0.1:10000".
            enforce_secure_algorithms: (Boolean) If enabled, only secure algorithms are allowed. This setting is currently enforced for SSH/SFTP. Available in the Enterprise edition.
            equality_check_mode: (Number) Defines how to check if two configs point to the same server (enables renaming between matching configs). 0 = username and endpoint must match (default), 1 = only the endpoint must match.
            expiration_date: (Number) Account expiration date as unix timestamp in milliseconds. An expired account cannot login.
            exposed_subpaths: '(List of String) Exposes only the listed sub-paths of the folder: each entry is mounted as a virtual directory under the virtual path and serves the matching sub-path of the folder. Canonical POSIX paths with a leading slash, each exposing a distinct subtree. On group mappings the same placeholders as the subpath are supported. Mutually exclusive with subpath. Available in the Enterprise edition.'
            external_auth_cache_time: (Number) Defines the cache time, in seconds, for users authenticated using an external auth hook. Not set means no cache.
            external_auth_disabled: (Boolean) If set, external auth hook will not be executed.
            file_patterns: (Attributes List) (see below for nested schema)
            filesystem: '(Attributes) Filesystem configuration. This block must be set explicitly: for the default local filesystem pass filesystem = { provider = 0 }. Defaults are no longer auto-populated from the server because the block contains write-only attributes. (see below for nested schema)'
            filters: (Attributes) (see below for nested schema)
            fingerprints: '(List of String) SHA256 fingerprints to validate when connecting to the external SFTP server. If not set any host key will be accepted: this is a security risk.'
            first_download: (Number) First download time as unix timestamp in milliseconds.
            first_upload: (Number) First upload time as unix timestamp in milliseconds.
            force_path_style: (Boolean) If set path-style addressing is used, i.e. http://s3.amazonaws.com/BUCKET/KEY
            from: (String) Start time in HH:MM format
            ftp_security: (Number) FTP security mode. Set to 1 to require TLS for both data and control connection.
            ftpconfig: (Attributes) Remote FTP server configuration details. Available in the Enterprise edition (see below for nested schema)
            gcsconfig: (Attributes) Google Cloud Storage configuration details. (see below for nested schema)
            gid: (Number) If SFTPGo runs as root system user then the created files and directories will be assigned to this system GID. Default not set.
            groups: (Attributes List) Groups. (see below for nested schema)
            hns: (Number) Set to 1 if Hierarchical namespace is enabled for the bucket. Available in the Enterprise edition.
            home_dir: '(String) Absolute path. Optional if the server has users_base_dir configured: in that case SFTPGo auto-assigns <users_base_dir>/<username>.'
            httpconfig: (Attributes) HTTP/S remote filesystem configuration details. (see below for nested schema)
            id: (String) Identifier of the resource, it matches the username attribute. terraform import takes the same value.
            is_anonymous: (Boolean) If enabled the user can login with any password or no password at all. Anonymous users are supported for FTP and WebDAV protocols and permissions will be automatically set to "list" and "download" (read only)
            key_passphrase: (String, Sensitive, Deprecated) Plain text passphrase for the private key. If you set a string in SFTPGo secret format, SFTPGo will keep the current secret on updates while the Terraform plan will save your value. Don't do this unless you are sure the values match (e.g because you imported an existing resource). Mutually exclusive with key_passphrase_wo.
            key_passphrase_wo: '(String, Sensitive, Write-only) Write-only variant of key_passphrase. Write-only variant of the matching attribute: the value is read from the configuration only and is never persisted to the Terraform plan or state. Requires Terraform 1.11 or later. Mutually exclusive with the non write-only attribute. Use the companion _wo_version attribute to trigger an update.'
            key_passphrase_wo_version: (String) Trigger attribute for key_passphrase_wo. Trigger attribute for the matching write-only attribute. Because write-only values are not stored in state, Terraform cannot detect changes to them. Bump this value to force the provider to re-apply the write-only value on the next apply.
            key_prefix: '(String) If specified then the SFTPGo user will be restricted to objects starting with the specified prefix. The prefix is normalized on save: a leading "/" is removed and a trailing "/" is added; a non-empty value that resolves to the storage root is rejected. Provide it already normalized (no leading "/", trailing "/") to avoid plan drift'
            last_login: (Number) Last login as unix timestamp in milliseconds.
            last_password_change: (Number) Last password change as unix timestamp in milliseconds.
            last_quota_update: (Number) Last quota update as unix timestamp in milliseconds.
            length: (Number) Minimum password length.
            lowers: (Number) Minimum number of lowercase characters required.
            managed_identity_client_id: (String) Client ID of the user-assigned managed identity to authenticate with. Set this when more than one user-assigned managed identity is available and account key/SAS URL are not used. Available in the Enterprise edition.
            mapped_path: (String) Absolute path to a local directory. This is the folder root path for local storage provider. For non-local filesystems it will store temporary files.
            max_sessions: (Number) Maximum concurrent sessions. Not set means no limit.
            max_shares_expiration: (Number) Maximum allowed expiration, as a number of days, when a user creates or updates a share. Not set means that non-expiring shares are allowed.
            max_upload_file_size: (Number) Max size allowed for a single upload. Unset means no limit.
            name: (String) Group name.
            osconfig: (Attributes) (see below for nested schema)
            passphrase: (String, Sensitive, Deprecated) Plain text passphrase. If you set a string in SFTPGo secret format, SFTPGo will keep the current secret on updates while the Terraform plan will save your value. Don't do this unless you are sure the values match (e.g because you imported an existing resource). Mutually exclusive with passphrase_wo.
            passphrase_wo: '(String, Sensitive, Write-only) Write-only variant of passphrase. Write-only variant of the matching attribute: the value is read from the configuration only and is never persisted to the Terraform plan or state. Requires Terraform 1.11 or later. Mutually exclusive with the non write-only attribute. Use the companion _wo_version attribute to trigger an update.'
            passphrase_wo_version: (String) Trigger attribute for passphrase_wo. Trigger attribute for the matching write-only attribute. Because write-only values are not stored in state, Terraform cannot detect changes to them. Bump this value to force the provider to re-apply the write-only value on the next apply.
            password: (String, Sensitive) Plain text password or hash format supported by SFTPGo. Set to empty to remove the password. Mutually exclusive with password_wo.
            password_expiration: (Number) The password expires after the defined number of days. Not set means no expiration
            password_policy: (Attributes) Static password complexity requirements. Each field overrides the primary group's corresponding value, which in turn overrides the system-level data_provider.password_validation default (overrides may be less strict than the system default). Whenever possible, prefer using the entropy-based approach provided by password_strength. Available in the Enterprise edition (see below for nested schema)
            password_strength: '(Number) Minimum password entropy enforced when a password is set. Not set means no per-user value: the primary group''s password_strength is used, otherwise the system-level data_provider.password_validation default. A non-zero value overrides the system default (the override may be less strict than the system default). Values in the 50-70 range are suggested for common use cases.'
            password_wo: '(String, Sensitive, Write-only) Write-only variant of password. Write-only variant of the matching attribute: the value is read from the configuration only and is never persisted to the Terraform plan or state. Requires Terraform 1.11 or later. Mutually exclusive with the non write-only attribute. Use the companion _wo_version attribute to trigger an update.'
            password_wo_version: (String) Trigger attribute for password_wo. Trigger attribute for the matching write-only attribute. Because write-only values are not stored in state, Terraform cannot detect changes to them. Bump this value to force the provider to re-apply the write-only value on the next apply.
            path: (String) Virtual path, if no other specific filter is defined, the filter applies for sub directories too.
            permissions: (Map of String) Comma separated, per-directory, permissions.
            pre_login_cache_time: (Number) Defines the cache time, in seconds, used by the pre-login hook gate. When greater than 0 the pre-login hook is skipped if the user's last login is within the configured window. Not set means no cache. Available in the Enterprise edition.
            pre_login_disabled: (Boolean) If set, external pre-login hook will not be executed.
            prefix: '(String) Similar to a chroot for local filesystem. Example: "/somedir/subdir".'
            private_key: (String, Sensitive, Deprecated) Plain text private key. If you set a string in SFTPGo secret format, SFTPGo will keep the current secret on updates while the Terraform plan will save your value. Don't do this unless you are sure the values match (e.g because you imported an existing resource). Mutually exclusive with private_key_wo.
            private_key_wo: '(String, Sensitive, Write-only) Write-only variant of private_key. Write-only variant of the matching attribute: the value is read from the configuration only and is never persisted to the Terraform plan or state. Requires Terraform 1.11 or later. Mutually exclusive with the non write-only attribute. Use the companion _wo_version attribute to trigger an update.'
            private_key_wo_version: (String) Trigger attribute for private_key_wo. Trigger attribute for the matching write-only attribute. Because write-only values are not stored in state, Terraform cannot detect changes to them. Bump this value to force the provider to re-apply the write-only value on the next apply.
            provider: (Number) Provider. -1 = None (on users the filesystem comes from the primary group, on groups no filesystem override for the members; Available in the Enterprise edition), 0 = local filesystem, 1 = S3 Compatible, 2 = Google Cloud, 3 = Azure Blob, 4 = Local encrypted, 5 = SFTP, 6 = HTTP, 7 = FTP
            public_keys: (List of String) List of public keys in OpenSSH format.
            quota_files: (Number) Maximum number of files allowed. Not set means no limit.
            quota_size: (Number) Maximum size allowed as bytes. Not set means no limit.
            read_buffer_size: (Number) Optional read buffer size, as MB, to use for downloads. Omit to disable buffering, that's fine in most use cases.
            region: (String) S3 region.
            remote_directory: '(String) Server-side path used as the starting directory for all operations. Not a security boundary: server-side symlinks may resolve outside it. Honored only while the ftp backend is enabled in the allow_remote_directory setting of the common configuration; it is still stored when the backend is disabled, but connections using it are rejected. Available in the Enterprise edition.'
            require_password_change: (Boolean) If set, user must change their password from WebClient/REST API at next login.
            role: (String) Role name. With resource isolation enabled on the role, the account reaches the groups and folders carrying it and its storage is measured against the allowlist of the role.
            role_arn: (String) Optional IAM Role ARN to assume.
            s3config: (Attributes) S3 compatible object storage configuration details. (see below for nested schema)
            sas_url: (String, Sensitive, Deprecated) Plain text SAS URL. If you set a string in SFTPGo secret format, SFTPGo will keep the current secret on updates while the Terraform plan will save your value. Don't do this unless you are sure the values match (e.g because you imported an existing resource). Mutually exclusive with sas_url_wo.
            sas_url_wo: '(String, Sensitive, Write-only) Write-only variant of sas_url. Write-only variant of the matching attribute: the value is read from the configuration only and is never persisted to the Terraform plan or state. Requires Terraform 1.11 or later. Mutually exclusive with the non write-only attribute. Use the companion _wo_version attribute to trigger an update.'
            sas_url_wo_version: (String) Trigger attribute for sas_url_wo. Trigger attribute for the matching write-only attribute. Because write-only values are not stored in state, Terraform cannot detect changes to them. Bump this value to force the provider to re-apply the write-only value on the next apply.
            session_token: (String) Optional Session token that is a part of temporary security credentials provisioned by AWS STS.
            sftpconfig: (Attributes) Remote SFTP server configuration details. (see below for nested schema)
            skip_tls_verify: (Boolean) If true, the TLS certificate of the FTP server is not verified.
            socks_password: (String, Sensitive, Deprecated) Plain text SOCKS password. If you set a string in SFTPGo secret format, SFTPGo will keep the current secret on updates while the Terraform plan will save your value. Don't do this unless you are sure the values match (e.g because you imported an existing resource). Mutually exclusive with socks_password_wo. Available in the Enterprise edition.
            socks_password_wo: '(String, Sensitive, Write-only) Write-only variant of socks_password. Write-only variant of the matching attribute: the value is read from the configuration only and is never persisted to the Terraform plan or state. Requires Terraform 1.11 or later. Mutually exclusive with the non write-only attribute. Use the companion _wo_version attribute to trigger an update.'
            socks_password_wo_version: (String) Trigger attribute for socks_password_wo. Trigger attribute for the matching write-only attribute. Because write-only values are not stored in state, Terraform cannot detect changes to them. Bump this value to force the provider to re-apply the write-only value on the next apply.
            socks_proxy: '(String) The address of the SOCKS proxy server, including schema, host, and port. Examples: socks5://127.0.0.1:1080, socks4://127.0.0.1:1080, socks4a://127.0.0.1:1080. Available in the Enterprise edition.'
            socks_username: (String) The optional SOCKS username. Available in the Enterprise edition.
            sources: (List of String) Source networks in CIDR notation as defined in RFC 4632 and RFC 4291 for example "192.0.2.0/24" or "2001:db8::/32". The limit applies if the defined networks contain the client IP.
            specials: (Number) Minimum number of special characters required.
            sse_customer_key: (String, Sensitive, Deprecated) Plain text Server-Side encryption key. If you set a string in SFTPGo secret format, SFTPGo will keep the current secret on updates while the Terraform plan will save your value. Don't do this unless you are sure the values match (e.g because you imported an existing resource). Mutually exclusive with sse_customer_key_wo.
            sse_customer_key_wo: '(String, Sensitive, Write-only) Write-only variant of sse_customer_key. Write-only variant of the matching attribute: the value is read from the configuration only and is never persisted to the Terraform plan or state. Requires Terraform 1.11 or later. Mutually exclusive with the non write-only attribute. Use the companion _wo_version attribute to trigger an update.'
            sse_customer_key_wo_version: (String) Trigger attribute for sse_customer_key_wo. Trigger attribute for the matching write-only attribute. Because write-only values are not stored in state, Terraform cannot detect changes to them. Bump this value to force the provider to re-apply the write-only value on the next apply.
            start_directory: (String) Alternate starting directory. If not set, the default is "/". This option is supported for SFTP/SCP, FTP and HTTP (WebClient/REST API) protocols. Relative paths will use this directory as base.
            status: (Number) 1 enabled, 0 disabled (login is not allowed).
            storage_class: (String) The storage class to use when storing objects. Leave not set for default.
            subpath: '(String) Re-roots the mapping: the mount at the virtual path serves the folder starting from this sub-path, which stays invisible in the virtual tree. Canonical POSIX path with a leading slash (e.g. /tenant1). The same folder can be mapped multiple times with distinct subpaths; every mapping of the same folder must use the same quota limits. On group mappings the %username% and %role% placeholders are supported. Mutually exclusive with exposed_subpaths.'
            tls_certs: (List of String) TLS certificates for mutual authentication. If provided will be checked before TLS username.
            tls_mode: (Number) 0 disabled, 1 Explicit, 2 Implicit.
            tls_username: (String) TLS certificate attribute to use as username. For FTP clients it must match the name provided using the "USER" command. For WebDAV, if no username is provided, the CN will be used as username. For WebDAV clients it must match the implicit or provided username.
            to: (String) End time in HH:MM format
            total_data_transfer: (Number) Maximum total data transfer as MB. Not set means unlimited. You can set a total data transfer instead of the individual values for uploads and downloads.
            two_factor_protocols: '(List of String) Defines protocols that require two factor authentication. Valid values: SSH, FTP, HTTP'
            type: (Number) Group type. 1 = Primary, 2 = Secondary, 3 = Membership only.
            uid: (Number) If SFTPGo runs as root system user then the created files and directories will be assigned to this system UID. Default not set.
            universe_domain: (String) The universe domain to use for Google Cloud API requests. If omitted or empty, the default public domain (googleapis.com) is used. Set this value if you need to connect to a custom Google Cloud environment, such as Google Distributed Cloud or a Sovereign Cloud. Available in the Enterprise edition
            updated_at: (Number) Last update time as unix timestamp in milliseconds.
            upload_bandwidth: (Number) Maximum upload bandwidth as KB/s. Not set means unlimited. This is the default if no per-source limit match.
            upload_concurrency: '(Number) How many parts are uploaded in parallel. Default: 5.'
            upload_data_transfer: (Number) Maximum data transfer allowed for uploads as MB. Not set means no limit.
            upload_part_max_time: (Number) The maximum time allowed, in seconds, to upload a single chunk. The default value is 32. Not set means use the default.
            upload_part_size: (Number) The buffer size (in MB) to use for multipart uploads. If this value is not set, the default value (5MB) will be used.
            uppers: (Number) Minimum number of uppercase characters required.
            use_emulator: (Boolean) If true, the Azure Storage Emulator (Azurite) is used instead of the cloud service.
            used_download_data_transfer: (Number) Downloaded size, as bytes, since the last reset.
            used_quota_files: (Number) Used quota as number of files.
            used_quota_size: (Number) Used quota as bytes.
            used_upload_data_transfer: (Number) Uploaded size, as bytes, since the last reset.
            user_type: '(String) Hint for authentication plugins. Valid values: LDAPUser, OSUser'
            username: (String) Unique username. Changing the username after creation forces replacement because the SFTPGo API does not support renaming.
            virtual_folders: (Attributes List) (see below for nested schema)
            virtual_path: (String) The folder will be available on this path.
            web_client: '(List of String) Web Client/user REST API restrictions. Valid values: write-disabled, password-change-disabled, password-reset-disabled, publickey-change-disabled, tls-cert-change-disabled, mfa-disabled, api-key-auth-change-disabled, info-change-disabled, shares-disabled, shares-without-password-disabled, shares-require-email-auth, shares-policy-change-disabled, wopi-disabled, rest-api-disabled. Only available in the Enterprise version: shares-require-email-auth, shares-policy-change-disabled, wopi-disabled, rest-api-disabled'
            write_buffer_size: (Number) Optional write buffer size, as MB, to use for uploads. Omit to disable buffering, that's fine in most use cases.
        importStatements:
            - |-
              # A user can be imported by username
              terraform import sftpgo_user.example username
