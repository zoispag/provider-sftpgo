name: drakkan/sftpgo
resources:
    sftpgo_action Resource - sftpgo:
        subCategory: ""
        description: Event action
        name: sftpgo_action Resource - sftpgo
        title: sftpgo_action Resource - sftpgo
        argumentDocs:
            "0": ': Login'
            "1": ': HTTP'
            "2": ': Command'
            "3": ': Email'
            "4": ': Backup'
            "5": ': User quota reset'
            "6": ': Folder quota reset'
            "7": ': Transfer quota reset'
            "8": ': Data retention check'
            "9": ': Filesystem'
            "11": ': Password expiration check'
            "12": ': User expiration check'
            "13": ': Identity Provider account check'
            "14": ': User inactivity check'
            "15": ': Rotate log file'
            "16": ': IMAP'
            "17": ': ICAP'
            "18": ': Share expiration check'
            "19": ': Event report'
            adapt_action: (Number) Action executed when the ICAP server returns a modified file.
            advance_notice: (Number) Number of days before the share expiration (real or calculated) to trigger the expiration event. Set to 0 to disable.
            archive_folder: (String) Virtual folder name. If set, files will be moved there instead of being deleted. Available in the Enterprise edition.
            archive_path: (String) The base path where archived files will be stored. Placeholders are supported. Available in the Enterprise edition.
            args: (List of String) Command line arguments.
            attach_event_report: (Boolean) If enabled, the event report generated by a previous event report action is attached as a compressed CSV file. Available in the Enterprise edition.
            attachments: (List of String) Paths to attach. The total size is limited to 10 MB.
            auth_type: (Number) Authentication type.
            bcc: (List of String) List of BCC email addresses. Placeholders are supported.
            block_action: (Number) Action executed when the ICAP server detects an infected file.
            body: (String) Body of the email. Placeholders are supported.
            client_id: (String) OAuth2 Client ID.
            client_secret: '(String, Sensitive, Deprecated) SFTPGo secret formatted as string: "$$$$". Mutually exclusive with client_secret_wo.'
            client_secret_wo: '(String, Sensitive, Write-only) Write-only variant of client_secret. Write-only variant of the matching attribute: the value is read from the configuration only and is never persisted to the Terraform plan or state. Requires Terraform 1.11 or later. Mutually exclusive with the non write-only attribute. Use the companion _wo_version attribute to trigger an update.'
            client_secret_wo_version: (String) Trigger attribute for client_secret_wo. Trigger attribute for the matching write-only attribute. Because write-only values are not stored in state, Terraform cannot detect changes to them. Bump this value to force the provider to re-apply the write-only value on the next apply.
            cmd: (String) Absolute path to the command to execute.
            cmd_config: (Attributes) External command action configurations. (see below for nested schema)
            compress: (Attributes) Configuration for paths to compress as zip. (see below for nested schema)
            content_type: (Number) Optional content type. 0 means text/plain, 1 means text/html. If omitted, text/plain is assumed.
            continue_on_error: (Boolean) Continue processing remaining files after a failure instead of stopping at the first error. Currently supported for copy actions only. Errors are collected and reported at the end. Available in the Enterprise edition.
            copy: (Attributes List) Paths to copy. The key is the source path, the value is the target. (see below for nested schema)
            decompress: (Attributes) Configuration for archive to extract. Available in the Enterprise edition (see below for nested schema)
            delete_empty_dirs: (Boolean) If enabled, empty directories will be deleted.
            delete_threshold: (Number) Inactivity in days, since the last login before deleting the account.
            deletes: (List of String) Paths to delete.
            description: (String) Optional description.
            disable_threshold: (Number) Inactivity in days, since the last login before disabling the account.
            dry_run: (Boolean) Produce the retention report without deleting files or creating archive copies. Available in the Enterprise edition.
            email_config: (Attributes) Email action configurations. (see below for nested schema)
            endpoint: (String) HTTP endpoint to invoke.
            env_vars: (Attributes List) Environment variables to set for the external command. (see below for nested schema)
            event_report_config: (Attributes) Event report action configurations. Populates the event report available to downstream email or HTTP actions. Available in the Enterprise edition. (see below for nested schema)
            exist: (List of String) Paths to check for existence.
            extract_dir: (String) Directory to extract the archive into.
            failure_policy: (Number) Action executed when the ICAP scan fails (e.g. server unreachable).
            filepath: (String) Path to the file to be sent as an attachment.
            folder: (String) Actions triggered by filesystem events, such as uploads or downloads, use the filesystem associated with the user. By specifying a folder, you can control which filesystem is used. This is especially useful for events that aren't tied to a user, such as scheduled tasks and advanced workflows. Available in the Enterprise edition.
            folders: (Attributes List) Folders to apply data retention rules to. (see below for nested schema)
            fs_actions: (List of String) Filter events by filesystem action (e.g. upload, download, delete). If empty, all actions are included.
            fs_config: (Attributes) Filesystem action configurations. (see below for nested schema)
            grace_period: (Number) Number of days a share is kept in the database after it has expired. Set to 0 to disable share deletion.
            headers: (Attributes List) Headers to add to the HTTP request. (see below for nested schema)
            http_config: (Attributes) HTTP action configurations. (see below for nested schema)
            icap_config: (Attributes) Enables integration with ICAP servers to perform antivirus scanning and DLP checks. Available in the Enterprise edition (see below for nested schema)
            id: (String) Identifier of the resource, it matches the name attribute. terraform import takes the same value.
            idp_config: (Attributes) Identity Provider account check action configurations. (see below for nested schema)
            imap_config: (Attributes) Enables automatic retrieval of email attachments from IMAP mailboxes. Available in the Enterprise edition (see below for nested schema)
            inactivity_threshold: (Number) Validity period (in days) for shares without an explicit expiration date. Checks last use or creation time. Set to 0 to disable.
            key: (String) Environment variable name.
            mailbox: (String) Mailbox to check, e.g. INBOX.
            max_retries: (Number) Number of retry attempts per file. Each retry waits 5 seconds. 0 means no retry. Available in the Enterprise edition.
            metadata: (Attributes) Metadata key/value pair to verify. If value is empty, the action passes when the key is absent. (see below for nested schema)
            metadata_check: (Attributes) This action verifies whether the metadata key matches the configured value or is absent for the specified path. Optionally, it can retry periodically until the specified timeout (in seconds) is reached. Available in the Enterprise edition. (see below for nested schema)
            method: (String) HTTP method.
            mkdirs: (List of String) Directories paths to create.
            mode: (Number) 1 = Encrypt, 2 = Decrypt.
            name: (String) Unique name. Changing the name after creation forces replacement because the SFTPGo API does not support renaming.
            oauth2: (Attributes) (see below for nested schema)
            on_source_copied: (Number) Source disposition after successful copy. 0 = none (default), 1 = delete source, 2 = move source to on_source_copied_move_path. Available in the Enterprise edition.
            on_source_copied_move_path: (String) Destination directory for moved sources. Required when on_source_copied is 2. The directory structure relative to source base is preserved. Available in the Enterprise edition.
            on_source_processed: (Number) Source disposition after a successful encrypt/decrypt. 0 = none (default), 1 = delete source, 2 = move source to on_source_processed_move_path.
            on_source_processed_move_path: (String) Destination directory for moved sources. Required when on_source_processed is 2.
            options: (Attributes) Configuration options specific for the action type. Must be specified (use options = {} when the action type has no options). Defaults are no longer auto-populated from the server because this block contains write-only attributes. (see below for nested schema)
            parts: (Attributes List) Multipart requests allow to combine one or more sets of data into a single body. For each part, you can set a file path or a body as text. Placeholders are supported in file path, body, header values. (see below for nested schema)
            passphrase: '(String, Sensitive, Deprecated) SFTPGo secret formatted as string: "$$$$". Mutually exclusive with passphrase_wo.'
            passphrase_wo: '(String, Sensitive, Write-only) Write-only variant of passphrase. Write-only variant of the matching attribute: the value is read from the configuration only and is never persisted to the Terraform plan or state. Requires Terraform 1.11 or later. Mutually exclusive with the non write-only attribute. Use the companion _wo_version attribute to trigger an update.'
            passphrase_wo_version: (String) Trigger attribute for passphrase_wo. Trigger attribute for the matching write-only attribute. Because write-only values are not stored in state, Terraform cannot detect changes to them. Bump this value to force the provider to re-apply the write-only value on the next apply.
            password: '(String, Sensitive, Deprecated) SFTPGo secret formatted as string: "$$$$". Mutually exclusive with password_wo.'
            password_wo: '(String, Sensitive, Write-only) Write-only variant of password. Write-only variant of the matching attribute: the value is read from the configuration only and is never persisted to the Terraform plan or state. Requires Terraform 1.11 or later. Mutually exclusive with the non write-only attribute. Use the companion _wo_version attribute to trigger an update.'
            password_wo_version: (String) Trigger attribute for password_wo. Trigger attribute for the matching write-only attribute. Because write-only values are not stored in state, Terraform cannot detect changes to them. Bump this value to force the provider to re-apply the write-only value on the next apply.
            path: (String) Virtual path to check.
            paths: (List of String) Paths to include in the compressed archive.
            pgp: (Attributes) Configuration for PGP actions. Either a password or a key pair is required. For encryption, the public key is required, and the private, if provided, will be used for signing. For decryption, the private key is required, and the public key, if provided, will be used for signature verification. Available in the Enterprise edition. (see below for nested schema)
            post_process_action: (Number) Action to perform on the email after processing.
            private_key: '(String, Sensitive, Deprecated) SFTPGo secret formatted as string: "$$$$". Mutually exclusive with private_key_wo.'
            private_key_wo: '(String, Sensitive, Write-only) Write-only variant of private_key. Write-only variant of the matching attribute: the value is read from the configuration only and is never persisted to the Terraform plan or state. Requires Terraform 1.11 or later. Mutually exclusive with the non write-only attribute. Use the companion _wo_version attribute to trigger an update.'
            private_key_wo_version: (String) Trigger attribute for private_key_wo. Trigger attribute for the matching write-only attribute. Because write-only values are not stored in state, Terraform cannot detect changes to them. Bump this value to force the provider to re-apply the write-only value on the next apply.
            profile: (Number) Algorithms to use. 0 = Default (widely implemented algorithms), 1 = RFC 4880, 2 = RFC 9580. Don't set to use the default.
            provider: (Number) OAuth2 Provider.
            public_key: (String) PGP public key in ASCII-armored format.
            pwd_expiration_config: (Attributes) Password expiration action configurations. (see below for nested schema)
            quarantine_folder: (String) The name of the virtual folder where quarantined files will be stored.
            quarantine_path: (String) The virtual path where quarantined files will be stored. Placeholders are supported.
            query_parameters: (Attributes List) Query parameters to add to the HTTP request. (see below for nested schema)
            recipients: (List of String) List of recipient email addresses. Placeholders are supported.
            refresh_token: '(String, Sensitive, Deprecated) SFTPGo secret formatted as string: "$$$$". Mutually exclusive with refresh_token_wo.'
            refresh_token_wo: '(String, Sensitive, Write-only) Write-only variant of refresh_token. Write-only variant of the matching attribute: the value is read from the configuration only and is never persisted to the Terraform plan or state. Requires Terraform 1.11 or later. Mutually exclusive with the non write-only attribute. Use the companion _wo_version attribute to trigger an update.'
            refresh_token_wo_version: (String) Trigger attribute for refresh_token_wo. Trigger attribute for the matching write-only attribute. Because write-only values are not stored in state, Terraform cannot detect changes to them. Bump this value to force the provider to re-apply the write-only value on the next apply.
            renames: (Attributes List) Paths to rename. The key is the source path, the value is the target. (see below for nested schema)
            retention: (Number) Retention as hours. 0 as retention means excluding the specified path.
            retention_config: (Attributes) Data retention action configurations. (see below for nested schema)
            share_expiration_config: (Attributes) Automated lifecycle management for shares based on inactivity, expiration, or max tokens. Available in the Enterprise edition (see below for nested schema)
            skip_tls_verify: (Boolean) If enabled any certificate presented by the server and any host name in that certificate are accepted. In this mode, TLS is susceptible to machine-in-the-middle attacks.
            source_folder: (String) Virtual folder name. When set, the retention check runs once as a system task on this folder. Paths in folders are relative to the folder root and rule-level user filters are ignored. Available in the Enterprise edition.
            split_events: (Boolean) If true, events are split. For example, email actions will send a separate notification for each share instead of a cumulative report.
            split_reports: (Boolean) If enabled, separate events are generated for each user, allowing subsequent actions to be executed individually per user.
            statuses: '(List of Number) Filter events by status: 1=OK, 2=error, 3=quota exceeded. If empty, all statuses are included.'
            subject: (String) Subject of the email. Placeholders are supported.
            target_folder: (String) By specifying a target folder, you can use a different filesystem for target paths than the one associated with the user who triggered the action. This is useful for moving files to another storage backend, such as a different S3 bucket or an external SFTP server, accessing restricted areas of the same storage backend, supporting scheduled actions, or enabling more advanced workflows. Available in the Enterprise edition.
            template_admin: (String) SFTPGo admin template in JSON format.
            template_user: (String) SFTPGo user template in JSON format.
            tenant: (String) OAuth2 Tenant.
            threshold: (Number) An email notification will be generated for users whose password expires in a number of days less than or equal to this threshold.
            time_window: (Number) Time window in minutes. The query range is [now - time_window, now].
            timeout: (Number) Time limit for the command in seconds.
            type: (Number) Action type.
            update_modtime: (Boolean) Update modification time. This setting is not recursive and only applies to storage providers that support changing modification times.
            user_inactivity_config: (Attributes) User inactivity check configurations. (see below for nested schema)
            username: (String) Username for HTTP basic authentication.
            value: (String) Environment variable value. Placeholders are supported.
        importStatements:
            - |-
              # An event action can be imported by name
              terraform import sftpgo_action.example "action name"
    sftpgo_admin Resource - sftpgo:
        subCategory: ""
        description: Admin
        name: sftpgo_admin Resource - sftpgo
        title: sftpgo_admin Resource - sftpgo
        argumentDocs:
            add_to_users_as: (Number) Add to users as the specified group type. 1 = Primary, 2 = Secondary, 3 = Membership only.
            additional_info: (String) Free form text field.
            allow_api_key_auth: (Boolean) If set, API Key authentication is allowed.
            allow_list: (List of String) Only connections from these IP/Mask are allowed. IP/Mask must be in CIDR notation as defined in RFC 4632 and RFC 4291 for example "192.0.2.0/24" or "2001:db8::/32"
            created_at: (Number) Creation time as unix timestamp in milliseconds.
            default_users_expiration: (Number) If set defines the default expiration for newly created users as number of days.
            description: (String) Optional description.
            disable_password_auth: (Boolean) If set, password authentication is disabled. The administrator can authenticate using an API key or OpenID Connect, if either is enabled. Available in the Enterprise edition.
            email: (String) Admin email address.
            filters: (Attributes) Additional restrictions. (see below for nested schema)
            groups: (Attributes List) Groups automatically selected for new users created by this admin. (see below for nested schema)
            hide_user_page_sections: (Number) If set allow to hide some sections from the user page in the WebAdmin. 1 = groups, 2 = filesystem, 4 = virtual folders, 8 = profile, 16 = ACL, 32 = Disk and bandwidth quota limits, 64 = Advanced. Settings can be combined.
            id: (String) Identifier of the resource, it matches the username attribute. terraform import takes the same value.
            last_login: (Number) Last login as unix timestamp in milliseconds.
            name: (String) Group name.
            options: (Attributes) Options for admin/group mapping (see below for nested schema)
            password: (String, Sensitive) Plain text password or hash format supported by SFTPGo. Exactly one of password and password_wo must be set.
            password_wo: '(String, Sensitive, Write-only) Write-only variant of password. Write-only variant of the matching attribute: the value is read from the configuration only and is never persisted to the Terraform plan or state. Requires Terraform 1.11 or later. Mutually exclusive with the non write-only attribute. Use the companion _wo_version attribute to trigger an update.'
            password_wo_version: (String) Trigger attribute for password_wo. Trigger attribute for the matching write-only attribute. Because write-only values are not stored in state, Terraform cannot detect changes to them. Bump this value to force the provider to re-apply the write-only value on the next apply.
            permissions: (List of String) Granted permissions. The granular group/folder permissions (view_groups, manage_groups, del_groups, view_folders, manage_folders, del_folders) are available in the Enterprise edition; manage_groups and manage_folders work on both editions.
            preferences: (Attributes) Admin preferences. (see below for nested schema)
            require_password_change: (Boolean) If set, two factor authentication is required.
            require_two_factor: (Boolean) If set, API Key authentication is allowed.
            role: (String) Role name. An admin carrying a role administers only the users carrying it. With resource isolation enabled on the role, the groups and folders carrying it are the only ones the admin reads, and the server applies the role to the resources the admin creates.
            status: (Number) 1 enabled, 0 disabled (login is not allowed).
            updated_at: (Number) Last update time as unix timestamp in milliseconds.
            username: (String) Unique username. Changing the username after creation forces replacement because the SFTPGo API does not support renaming.
        importStatements:
            - |-
              # An administrator can be imported by username
              terraform import sftpgo_admin.example admin
    sftpgo_allowlist_entry Resource - sftpgo:
        subCategory: ""
        description: Allow list entry
        name: sftpgo_allowlist_entry Resource - sftpgo
        title: sftpgo_allowlist_entry Resource - sftpgo
        argumentDocs:
            created_at: (Number) Creation time as unix timestamp in milliseconds.
            description: (String) Optional description.
            id: (String) Identifier of the resource, it matches the ipornet attribute. terraform import takes the same value.
            ipornet: (String) IP address or network in CIDR format, for example "192.168.1.2/32", "192.168.0.0/24", "2001:db8::/32". Changing this value after creation forces replacement because the SFTPGo API does not support renaming.
            protocols: (Number) Defines the protocol the entry applies to. 0 means all the supported protocols, 1 SSH, 2 FTP, 4 WebDAV, 8 HTTP. Protocols can be combined, for example 3 means SSH and FTP.
            updated_at: (Number) Last update time as unix timestamp in milliseconds.
        importStatements:
            - |-
              # An allow list entry can be imported by IP or network
              terraform import sftpgo_allowlist_entry.example 192.168.1.0/24
    sftpgo_defender_entry Resource - sftpgo:
        subCategory: ""
        description: Defender entry
        name: sftpgo_defender_entry Resource - sftpgo
        title: sftpgo_defender_entry Resource - sftpgo
        argumentDocs:
            created_at: (Number) Creation time as unix timestamp in milliseconds.
            description: (String) Optional description.
            id: (String) Identifier of the resource, it matches the ipornet attribute. terraform import takes the same value.
            ipornet: (String) IP address or network in CIDR format, for example "192.168.1.2/32", "192.168.0.0/24", "2001:db8::/32". Changing this value after creation forces replacement because the SFTPGo API does not support renaming.
            mode: (Number) 1 = allow, 2 = deny.
            protocols: (Number) Defines the protocol the entry applies to. 0 means all the supported protocols, 1 SSH, 2 FTP, 4 WebDAV, 8 HTTP. Protocols can be combined, for example 3 means SSH and FTP.
            updated_at: (Number) Last update time as unix timestamp in milliseconds.
        importStatements:
            - |-
              # A defender list entry can be imported by IP or network
              terraform import sftpgo_defender_entry.example 192.168.1.1/32
    sftpgo_folder Resource - sftpgo:
        subCategory: ""
        description: Virtual folder
        name: sftpgo_folder Resource - sftpgo
        title: sftpgo_folder Resource - sftpgo
        argumentDocs:
            access_key: (String) AWS Access Key ID for authentication. Leave blank when using IAM roles or instance profiles.
            access_secret: (String, Sensitive, Deprecated) Plain text access secret. If you set a string in SFTPGo secret format, SFTPGo will keep the current secret on updates while the Terraform plan will save your value. Don't do this unless you are sure the values match (e.g because you imported an existing resource). Mutually exclusive with access_secret_wo.
            access_secret_wo: '(String, Sensitive, Write-only) Write-only variant of access_secret. Write-only variant of the matching attribute: the value is read from the configuration only and is never persisted to the Terraform plan or state. Requires Terraform 1.11 or later. Mutually exclusive with the non write-only attribute. Use the companion _wo_version attribute to trigger an update.'
            access_secret_wo_version: (String) Trigger attribute for access_secret_wo. Trigger attribute for the matching write-only attribute. Because write-only values are not stored in state, Terraform cannot detect changes to them. Bump this value to force the provider to re-apply the write-only value on the next apply.
            access_tier: (String) Blob Access Tier. Not set means the container default.
            account_key: (String, Sensitive, Deprecated) Plain text account key. If you set a string in SFTPGo secret format, SFTPGo will keep the current secret on updates while the Terraform plan will save your value. Don't do this unless you are sure the values match (e.g because you imported an existing resource). Mutually exclusive with account_key_wo.
            account_key_wo: '(String, Sensitive, Write-only) Write-only variant of account_key. Write-only variant of the matching attribute: the value is read from the configuration only and is never persisted to the Terraform plan or state. Requires Terraform 1.11 or later. Mutually exclusive with the non write-only attribute. Use the companion _wo_version attribute to trigger an update.'
            account_key_wo_version: (String) Trigger attribute for account_key_wo. Trigger attribute for the matching write-only attribute. Because write-only values are not stored in state, Terraform cannot detect changes to them. Bump this value to force the provider to re-apply the write-only value on the next apply.
            account_name: (String) Storage account name. Leave blank to use SAS URL.
            acl: (String) The ACL to apply to uploaded objects. Not set means the bucket default.
            api_key: (String, Sensitive, Deprecated) Plain text API key. If you set a string in SFTPGo secret format, SFTPGo will keep the current secret on updates while the Terraform plan will save your value. Don't do this unless you are sure the values match (e.g because you imported an existing resource). Mutually exclusive with api_key_wo.
            api_key_wo: '(String, Sensitive, Write-only) Write-only variant of api_key. Write-only variant of the matching attribute: the value is read from the configuration only and is never persisted to the Terraform plan or state. Requires Terraform 1.11 or later. Mutually exclusive with the non write-only attribute. Use the companion _wo_version attribute to trigger an update.'
            api_key_wo_version: (String) Trigger attribute for api_key_wo. Trigger attribute for the matching write-only attribute. Because write-only values are not stored in state, Terraform cannot detect changes to them. Bump this value to force the provider to re-apply the write-only value on the next apply.
            automatic_credentials: (Number) 0 = disabled, explicit JSON credentials must be provided (default); 1 = enabled, use Application Default Credentials (ADC) to find credentials.
            azblobconfig: (Attributes) Azure Blob Storage configuration details. (see below for nested schema)
            bucket: (String) GCS bucket name.
            buffer_size: (Number) The buffer size (in MB) to use for uploads/downloads. Buffering could improve performance for high latency networks. With buffering enabled upload resume is not supported and a file cannot be opened for both reading and writing at the same time. Not set means disabled.
            checksum_algorithm: '(String) Checksum algorithm to compute and send with uploads (PutObject, multipart upload, CopyObject) for end-to-end integrity verification. Leave empty (default) for maximum compatibility with S3-compatible services. Supported values: "crc32", "crc32c", "crc64nvme", "sha1", "sha256". Available in the Enterprise edition.'
            container: (String) Azure Blob Storage container name.
            credentials: (String, Sensitive, Deprecated) Plain text credentials. If you set a string in SFTPGo secret format, SFTPGo will keep the current secret on updates while the Terraform plan will save your value. Don't do this unless you are sure the values match (e.g because you imported an existing resource). Mutually exclusive with credentials_wo.
            credentials_wo: '(String, Sensitive, Write-only) Write-only variant of credentials. Write-only variant of the matching attribute: the value is read from the configuration only and is never persisted to the Terraform plan or state. Requires Terraform 1.11 or later. Mutually exclusive with the non write-only attribute. Use the companion _wo_version attribute to trigger an update.'
            credentials_wo_version: (String) Trigger attribute for credentials_wo. Trigger attribute for the matching write-only attribute. Because write-only values are not stored in state, Terraform cannot detect changes to them. Bump this value to force the provider to re-apply the write-only value on the next apply.
            cryptconfig: (Attributes) (see below for nested schema)
            description: (String) Optional description.
            disable_concurrent_reads: (Boolean) Concurrent reads are safe to use and disabling them will degrade performance so they are enabled by default. Some servers automatically delete files once they are downloaded. Using concurrent reads is problematic with such servers.
            disable_concurrent_writes: (Boolean) Send write requests to the remote server one at a time, disabling SFTP write pipelining. Enable it for servers that accept only one write request at a time; throughput is then bound by the network round-trip time. Available in the Enterprise edition.
            download_concurrency: '(Number) How many parts are downloaded in parallel. Default: 5.'
            download_part_max_time: (Number) The maximum time allowed, in seconds, to download a single chunk. Not set means no timeout. Ignored for partial downloads.
            download_part_size: (Number) The buffer size (in MB) to use for multipart downloads. If this value is not set, the default value (5MB) will be used.
            endpoint: (String) Optional endpoint. Default is "blob.core.windows.net". If you use the emulator the endpoint must include the protocol, for example "http://127.0.0.1:10000".
            equality_check_mode: (Number) Defines how to check if two configs point to the same server (enables renaming between matching configs). 0 = username and endpoint must match (default), 1 = only the endpoint must match.
            filesystem: '(Attributes) Filesystem configuration. This block must be set explicitly: for the default local filesystem pass filesystem = { provider = 0 }. Defaults are no longer auto-populated from the server because the block contains write-only attributes. (see below for nested schema)'
            fingerprints: '(List of String) SHA256 fingerprints to validate when connecting to the external SFTP server. If not set any host key will be accepted: this is a security risk.'
            force_path_style: (Boolean) If set path-style addressing is used, i.e. http://s3.amazonaws.com/BUCKET/KEY
            ftpconfig: (Attributes) Remote FTP server configuration details. Available in the Enterprise edition (see below for nested schema)
            gcsconfig: (Attributes) Google Cloud Storage configuration details. (see below for nested schema)
            hns: (Number) Set to 1 if Hierarchical namespace is enabled for the bucket. Available in the Enterprise edition.
            httpconfig: (Attributes) HTTP/S remote filesystem configuration details. (see below for nested schema)
            id: (String) Identifier of the resource, it matches the name attribute. terraform import takes the same value.
            key_passphrase: (String, Sensitive, Deprecated) Plain text passphrase for the private key. If you set a string in SFTPGo secret format, SFTPGo will keep the current secret on updates while the Terraform plan will save your value. Don't do this unless you are sure the values match (e.g because you imported an existing resource). Mutually exclusive with key_passphrase_wo.
            key_passphrase_wo: '(String, Sensitive, Write-only) Write-only variant of key_passphrase. Write-only variant of the matching attribute: the value is read from the configuration only and is never persisted to the Terraform plan or state. Requires Terraform 1.11 or later. Mutually exclusive with the non write-only attribute. Use the companion _wo_version attribute to trigger an update.'
