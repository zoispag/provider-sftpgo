                      and its storage is measured against the allowlist of the role.
                    type: string
                  status:
                    description: 1 enabled, 0 disabled (login is not allowed).
                    type: number
                  totalDataTransfer:
                    description: Maximum total data transfer as MB. Not set means
                      unlimited. You can set a total data transfer instead of the
                      individual values for uploads and downloads.
                    type: number
                  uid:
                    description: If SFTPGo runs as root system user then the created
                      files and directories will be assigned to this system UID. Default
                      not set.
                    type: number
                  uploadBandwidth:
                    description: Maximum upload bandwidth as KB/s. Not set means unlimited.
                      This is the default if no per-source limit match.
                    type: number
                  uploadDataTransfer:
                    description: Maximum data transfer allowed for uploads as MB.
                      Not set means no limit.
                    type: number
                  virtualFolders:
                    items:
                      properties:
                        description:
                          description: Optional description.
                          type: string
                        exposedSubpaths:
                          description: 'Exposes only the listed sub-paths of the folder:
                            each entry is mounted as a virtual directory under the
                            virtual path and serves the matching sub-path of the folder.
                            Canonical POSIX paths with a leading slash, each exposing
                            a distinct subtree. On group mappings the same placeholders
                            as the subpath are supported. Mutually exclusive with
                            `subpath`. Available in the Enterprise edition.'
                          items:
                            type: string
                          type: array
                        lastQuotaUpdate:
                          description: Last quota update as unix timestamp in milliseconds
                          type: number
                        mappedPath:
                          description: Absolute path to a local directory. This is
                            the folder root path for local storage provider. For non-local
                            filesystems it will store temporary files.
                          type: string
                        name:
                          description: Unique folder name
                          type: string
                        quotaFiles:
                          description: Maximum number of files allowed. Not set means
                            unlimited, -1 included in user quota
                          type: number
                        quotaSize:
                          description: Maximum size allowed as bytes. Not set means
                            unlimited, -1 included in user quota
                          type: number
                        subpath:
                          description: 'Re-roots the mapping: the mount at the virtual
