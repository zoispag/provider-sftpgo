                    - name
                    type: object
                  permissions:
                    additionalProperties:
                      type: string
                    description: Comma separated, per-directory, permissions.
                    type: object
                    x-kubernetes-map-type: granular
                  publicKeys:
                    description: List of public keys in OpenSSH format.
                    items:
                      type: string
                    type: array
                  quotaFiles:
                    description: Maximum number of files allowed. Not set means no
