                              for uploads. Omit to disable no buffering, that's fine
                              in most use cases.
                            type: number
                        type: object
                      provider:
                        description: Provider. -1 = None (on users the filesystem
                          comes from the primary group, on groups no filesystem override
                          for the members; Available in the Enterprise edition), 0
                          = local filesystem, 1 = S3 Compatible, 2 = Google Cloud,
                          3 = Azure Blob, 4 = Local encrypted, 5 = SFTP, 6 = HTTP,
                          7 = FTP
                        type: number
                      s3config:
                        properties:
                          accessKey:
                            description: AWS Access Key ID for authentication. Leave
                              blank when using IAM roles or instance profiles.
                            type: string
                          accessSecretSecretRef:
                            description: Plain text access secret. Don't do this unless
                              you are sure the values match (e.g because you imported
                              an existing resource). Mutually exclusive with `access_secret_wo`.
                            properties:
                              key:
                                type: string
                              name:
                                description: Name of the secret.
                                type: string
                            required:
                            - key
                            - name
                            type: object
                          accessSecretWoSecretRef:
                            description: Write-only variant of `access_secret`.11
                              or later. Mutually exclusive with the non write-only
                              attribute. Use the companion _wo_version attribute to
                              trigger an update.
                            properties:
                              key:
                                type: string
                              name:
                                description: Name of the secret.
                                type: string
                            required:
                            - key
                            - name
                            type: object
                          accessSecretWoVersion:
                            description: Trigger attribute for `access_secret_wo`.
                              Trigger attribute for the matching write-only attribute.
                              Bump this value to force the provider to re-apply the
                              write-only value on the next apply.
                            type: string
                          acl:
                            description: The canned ACL to apply to uploaded objects.
                              Not set means the bucket default.
                            type: string
                          bucket:
                            description: S3 bucket name.
                            type: string
                          checksumAlgorithm:
                            description: 'Checksum algorithm to compute and send with
                              uploads (PutObject, multipart upload, CopyObject) for
                              end-to-end integrity verification. Leave empty (default)
                              for maximum compatibility with S3-compatible services.
                              Supported values: "crc32", "crc32c", "crc64nvme", "sha1",
                              "sha256". Available in the Enterprise edition.'
                            type: string
                          downloadConcurrency:
                            description: How many parts are downloaded in parallel.
                              Not set means the default (5). Ignored for partial downloads.
                            type: number
                          downloadPartMaxTime:
                            description: The maximum time allowed, in seconds, to
                              download a single chunk. Not set means no timeout. Ignored
                              for partial downloads.
                            type: number
                          downloadPartSize:
                            description: The buffer size (in MB) to use for multipart
                              downloads. If this value is not set, the default value
                              (5MB) will be used.
                            type: number
                          endpoint:
                            description: The endpoint is generally required for S3
                              compatible backends. For AWS S3, leave not set to use
                              the default endpoint for the specified region.
                            type: string
                          forcePathStyle:
                            description: If set path-style addressing is used, i.e.
                              http://s3.amazonaws.com/BUCKET/KEY
                            type: boolean
                          keyPrefix:
                            description: 'If specified then the SFTPGo user will be
                              restricted to objects starting with the specified prefix.
                              The prefix is normalized on save: a leading "/" is removed
                              and a trailing "/" is added; a non-empty value that
                              resolves to the storage root is rejected. Provide it
                              already normalized (no leading "/", trailing "/") to
                              avoid plan drift'
                            type: string
                          region:
                            description: S3 region.
                            type: string
                          roleArn:
                            description: Optional IAM Role ARN to assume.
                            type: string
                          sessionTokenSecretRef:
                            description: Optional Session token that is a part of
                              temporary security credentials provisioned by AWS STS.
                            properties:
                              key:
                                type: string
                              name:
                                description: Name of the secret.
                                type: string
                            required:
                            - key
                            - name
                            type: object
                          skipTlsVerify:
                            description: If set the S3 client accepts any TLS certificate
                              presented by the server and any host name in that certificate.
                              In this mode, TLS is susceptible to man-in-the-middle
                              attacks. This should be used only for testing.
                            type: boolean
                          sseCustomerKeySecretRef:
                            description: Plain text Server-Side encryption key. Don't
                              do this unless you are sure the values match (e.g because
                              you imported an existing resource). Mutually exclusive
                              with `sse_customer_key_wo`.
                            properties:
                              key:
                                type: string
                              name:
                                description: Name of the secret.
                                type: string
                            required:
                            - key
                            - name
                            type: object
                          sseCustomerKeyWoSecretRef:
                            description: Write-only variant of `sse_customer_key`.11
                              or later. Mutually exclusive with the non write-only
                              attribute. Use the companion _wo_version attribute to
                              trigger an update.
                            properties:
                              key:
                                type: string
                              name:
                                description: Name of the secret.
                                type: string
                            required:
                            - key
                            - name
                            type: object
                          sseCustomerKeyWoVersion:
                            description: Trigger attribute for `sse_customer_key_wo`.
                              Trigger attribute for the matching write-only attribute.
                              Bump this value to force the provider to re-apply the
                              write-only value on the next apply.
                            type: string
                          storageClass:
                            description: The storage class to use when storing objects.
                              Leave not set for default.
                            type: string
                          uploadConcurrency:
                            description: How many parts are uploaded in parallel.
                              Not set means the default (5).
                            type: number
                          uploadPartMaxTime:
                            description: The maximum time allowed, in seconds, to
                              upload a single chunk. Not set means no timeout.
                            type: number
                          uploadPartSize:
                            description: The buffer size (in MB) to use for multipart
                              uploads. If this value is not set, the default value
                              (5MB) will be used.
                            type: number
                        type: object
                    type: object
                  filters:
                    properties:
                      accessTime:
                        items:
                          properties:
                            dayOfWeek:
                              description: Day of week, 0 Sunday, 6 Saturday
                              type: number
                            from:
                              description: Start time in HH:MM format
                              type: string
                            to:
                              description: End time in HH:MM format
                              type: string
                          type: object
                        type: array
                      additionalEmails:
                        description: Additional email addresses.
                        items:
                          type: string
                        type: array
                      allowApiKeyAuth:
                        description: If set, API Key authentication is allowed.
