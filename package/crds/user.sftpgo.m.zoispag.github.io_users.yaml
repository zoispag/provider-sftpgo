                          non-expiring shares are allowed.
                        type: number
                      maxUploadFileSize:
                        description: Max size allowed for a single upload. Unset means
                          no limit.
                        type: number
                      passwordExpiration:
                        description: The password expires after the defined number
                          of days. Not set means no expiration
                        type: number
                      passwordPolicy:
                        properties:
                          digits:
                            description: Minimum number of digit characters required.
                            type: number
                          length:
                            description: Minimum password length.
                            type: number
                          lowers:
                            description: Minimum number of lowercase characters required.
                            type: number
                          specials:
                            description: Minimum number of special characters required.
                            type: number
                          uppers:
                            description: Minimum number of uppercase characters required.
                            type: number
                        type: object
                      passwordStrength:
                        description: 'Minimum password entropy enforced when a password
                          is set. Not set means no per-user value: the primary group''s
                          password_strength is used, otherwise the system-level data_provider.password_validation
                          default. A non-zero value overrides the system default (the
                          override may be less strict than the system default). Values
                          in the 50-70 range are suggested for common use cases.'
                        type: number
                      preLoginCacheTime:
                        description: Defines the cache time, in seconds, used by the
                          pre-login hook gate. When greater than 0 the pre-login hook
                          is skipped if the user's last login is within the configured
                          window. Not set means no cache. Available in the Enterprise
                          edition.
                        type: number
                      preLoginDisabled:
                        description: If set, external pre-login hook will not be executed.
                        type: boolean
                      requirePasswordChange:
                        description: If set, user must change their password from
                          WebClient/REST API at next login.
                        type: boolean
                      startDirectory:
                        description: Alternate starting directory. If not set, the
                          default is "/". This option is supported for SFTP/SCP, FTP
