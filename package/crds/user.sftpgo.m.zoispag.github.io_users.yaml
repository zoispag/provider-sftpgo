                              items:
                                type: string
                              type: array
                            deniedPatterns:
                              description: Files/directories with these, case insensitive,
                                patterns are not allowed.
                              items:
                                type: string
                              type: array
                            denyPolicy:
                              description: Set to 1 to hide denied files/directories
