                        items:
                          type: string
                        type: array
                      bandwidthLimits:
                        items:
                          properties:
                            downloadBandwidth:
                              description: Maximum download bandwidth as KB/s.
                              type: number
                            sources:
                              description: Source networks in CIDR notation as defined
                                in RFC 4632 and RFC 4291 for example "192.0.2.0/24"
                                or "2001:db8::/32". The limit applies if the defined
                                networks contain the client IP.
                              items:
                                type: string
                              type: array
                            uploadBandwidth:
                              description: Maximum upload bandwidth as KB/s.
