                        type: string
                      tlsCerts:
                        description: TLS certificates for mutual authentication. If
                          provided will be checked before TLS username.
                        items:
                          type: string
                        type: array
                      tlsUsername:
                        description: TLS certificate attribute to use as username.
                          For FTP clients it must match the name provided using the
                          "USER" command. For WebDAV, if no username is provided,
