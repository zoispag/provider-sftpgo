                          acl:
                            description: The canned ACL to apply to uploaded objects.
                              Not set means the bucket default.
                            type: string
                          bucket:
                            description: S3 bucket name.
                            type: string
                          checksumAlgorithm:
                            description: 'Checksum algorithm to compute and send with
