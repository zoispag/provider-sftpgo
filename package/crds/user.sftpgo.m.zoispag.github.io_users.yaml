                      allowedIp:
                        description: Only connections from these IP/Mask are allowed.
                          IP/Mask must be in CIDR notation as defined in RFC 4632
                          and RFC 4291 for example "192.0.2.0/24" or "2001:db8::/32"
                        items:
                          type: string
                        type: array
                      allowedSharePaths:
                        description: 'Virtual paths within which shares are allowed.
                          If non-empty, share paths must be at or below one of these
