                          api-key-auth-change-disabled, info-change-disabled, shares-disabled,
                          shares-without-password-disabled, shares-require-email-auth,
                          shares-policy-change-disabled, wopi-disabled, rest-api-disabled.
                          Only available in the Enterprise version: shares-require-email-auth,
                          shares-policy-change-disabled, wopi-disabled, rest-api-disabled'
